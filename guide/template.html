<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Гайд для мастера</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f3f5f8; --surface:#ffffff; --text:#151a21; --muted:#4b5565;
  --border:#d0d6df; --border-strong:#6b7586;
  --accent:#1d4ed8; --on-accent:#ffffff; --focus:#1d4ed8;
  --ok-text:#14532d; --ok-bg:#dcfce7;
  --err-text:#991b1b; --err-bg:#fee2e2;
  --notice-text:#1e3a8a; --notice-bg:#dbeafe;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f131a; --surface:#181e28; --text:#e8ecf3; --muted:#aab3c2;
    --border:#2c3545; --border-strong:#8791a3;
    --accent:#8ab4ff; --on-accent:#0b1220; --focus:#8ab4ff;
    --ok-text:#a7f3c0; --ok-bg:#12301e;
    --err-text:#fecaca; --err-bg:#3b1517;
    --notice-text:#bfdbfe; --notice-bg:#14233f;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
body.sheet-open { overflow: hidden; }
body.sheet-open .dock { visibility: hidden; }
#cheat-title:focus, #price-title:focus, #price-selected-title:focus { outline: none; }
#price-selected-title { scroll-margin-top: 4.5rem; }
h1, h2, h3, p, ol, ul { margin: 0; }
h1 { font-size: 1.5rem; line-height: 1.25; }
h2 { font-size: 1.25rem; line-height: 1.3; }
h3 { font-size: 1.125rem; line-height: 1.3; }
strong { font-weight: 700; }

.wrap { max-width: 48rem; margin: 0 auto; padding: 1rem 1rem calc(6rem + env(safe-area-inset-bottom, 0px)); }
.page-head { display: grid; gap: .75rem; margin-bottom: 1.25rem; }
.overall-text { font-weight: 600; }
.bar { height: .625rem; border-radius: .3125rem; background: var(--border); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
.storage-note { font-weight: 600; color: var(--err-text); background: var(--err-bg); border-radius: .5rem; padding: .5rem .75rem; }

.banner { display: grid; gap: .5rem; padding: .75rem 1rem; border-radius: .75rem; font-weight: 600; background: var(--notice-bg); color: var(--notice-text); }
.banner[data-state="ready"] { background: var(--ok-bg); color: var(--ok-text); }
.banner button { justify-self: start; }

.toc { background: var(--surface); border: 1px solid var(--border-strong); border-radius: .75rem; }
.toc summary { min-height: 44px; padding: .5rem 1rem; display: flex; align-items: center; cursor: pointer; font-weight: 600; }
.toc ol { list-style: none; padding: 0 .5rem .5rem; display: grid; gap: .25rem; }
.toc a { display: flex; justify-content: space-between; gap: .75rem; align-items: center; min-height: 44px; padding: .25rem .5rem; border-radius: .5rem; color: var(--text); text-decoration: none; }
.toc a:hover { background: var(--bg); }
.toc-count { color: var(--muted); white-space: nowrap; }

.howto { background: var(--surface); border: 1px solid var(--border-strong); border-radius: .75rem; padding: 1rem; margin-bottom: 1.25rem; display: grid; gap: .75rem; }
.howto ol { padding-left: 1.25rem; display: grid; gap: .5rem; }

.stage { margin-bottom: 1.75rem; scroll-margin-top: .5rem; }
.stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; margin-bottom: .5rem; }
.stage-head h2:focus { outline: none; }
.stage-progress { color: var(--muted); font-weight: 600; white-space: nowrap; }
.stage-intro { color: var(--muted); margin: .5rem 0 .75rem; }
.optional-head { margin: 1rem 0 .5rem; }
.optional-note { color: var(--muted); margin-bottom: .5rem; }

.step { background: var(--surface); border: 1px solid var(--border); border-left: .3125rem solid var(--border-strong); border-radius: .75rem; padding: 1rem; margin-bottom: .75rem; display: grid; gap: .75rem; scroll-margin-top: .5rem; }
.step.done { border-left-color: var(--ok-text); border-color: var(--ok-text); }
.step-title:focus { outline: none; }
.step.done .step-title::before { content: "\2713\00a0"; color: var(--ok-text); }
.kind { color: var(--muted); font-weight: 600; }
.points { padding-left: 1.5rem; display: grid; gap: .375rem; }

.send { display: grid; gap: .5rem; }
.send-label { font-weight: 600; }
.msg { margin: 0; padding: .75rem; background: var(--bg); border: 1px solid var(--border-strong); border-radius: .5rem; font: inherit; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.ph { background: var(--notice-bg); color: var(--notice-text); font-weight: 700; padding: 0 .25rem; border-radius: .25rem; outline: 1px dashed currentColor; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.copy-status { font-weight: 600; color: var(--muted); }

.links { display: flex; flex-wrap: wrap; gap: .5rem; }
.tip { background: var(--notice-bg); color: var(--notice-text); border-radius: .5rem; padding: .75rem; }
.proof { background: var(--ok-bg); color: var(--ok-text); border-radius: .5rem; padding: .75rem; font-weight: 600; }

button, .linkbtn, input, textarea, select, summary { font: inherit; }
button, .linkbtn { min-height: 44px; min-width: 44px; padding: .5rem 1rem; border-radius: .625rem; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }
button:hover, .linkbtn:hover { background: var(--bg); }
button:disabled { border-color: var(--border-strong); color: var(--muted); background: var(--bg); cursor: not-allowed; }
.mark { min-height: 48px; justify-self: start; }
.mark[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.mark[aria-pressed="true"]::before { content: "\2713\00a0"; }
.btn-danger { border-color: var(--err-text); color: var(--err-text); }
.btn-solid { background: var(--accent); color: var(--on-accent); }
.btn-solid:hover { background: var(--accent); filter: brightness(1.08); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.page-foot { display: grid; gap: .75rem; justify-items: start; }
.reset-box { background: var(--err-bg); color: var(--err-text); border-radius: .75rem; padding: 1rem; display: grid; gap: .75rem; font-weight: 600; }
.reset-box .actions button { background: var(--surface); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--border-strong); padding: .5rem 1rem calc(.5rem + env(safe-area-inset-bottom, 0px)); }
.dock-row { display: flex; gap: .5rem; max-width: 48rem; margin: 0 auto; }
.dock button { flex: 1 1 0; min-width: 0; min-height: 52px; padding: .5rem; font-size: 1.125rem; background: var(--accent); color: var(--on-accent); }

.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .5); }
.sheet-inner { width: 100%; max-width: 48rem; max-height: 94vh; max-height: 94dvh; overflow: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 1rem 1rem 0 0; padding: 0 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: .75rem; background: var(--bg); padding: .75rem 0; }
.sheet-body { display: grid; gap: 1.25rem; }
.sheet-section { display: grid; gap: .75rem; }
.fields { display: grid; gap: .75rem; background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; }
.field { display: grid; gap: .25rem; }
label { font-weight: 600; }
input, textarea, select { width: 100%; min-height: 44px; padding: .5rem .75rem; border: 2px solid var(--border-strong); border-radius: .5rem; background: var(--bg); color: var(--text); }
textarea { resize: vertical; }
::placeholder { color: var(--muted); opacity: 1; }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--err-text); }
.hint { color: var(--muted); }
.hint[data-state="invalid"] { color: var(--err-text); background: var(--err-bg); border-radius: .375rem; padding: .25rem .5rem; font-weight: 600; }
.hint[data-state="warn"] { color: var(--notice-text); background: var(--notice-bg); border-radius: .375rem; padding: .25rem .5rem; font-weight: 600; }
.hint:empty { display: none; }

.chain { list-style: none; padding: 0; display: grid; gap: .75rem; }
.chain-item { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; display: grid; gap: .5rem; }
.chip { font-weight: 700; }

.report { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; }
.report > summary { min-height: 48px; padding: .5rem 1rem; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
.report-body { display: grid; gap: .75rem; padding: 0 1rem 1rem; }
.result { display: grid; gap: .5rem; }
.result-wait { color: var(--muted); font-weight: 600; }
.note { font-weight: 600; background: var(--ok-bg); color: var(--ok-text); border-radius: .5rem; padding: .75rem; }

.price-tools { display: grid; gap: .75rem; background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; }
.price-groups { display: grid; gap: .5rem; }
.group-head { margin: .5rem 0 .25rem; color: var(--muted); font-size: 1rem; font-weight: 700; }
.price-list { list-style: none; padding: 0; display: grid; gap: .5rem; }
.price-item { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: .75rem; display: grid; gap: .5rem; }
.item-top { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; }
.item-name { font-weight: 600; }
.item-no { color: var(--muted); }
.item-price { font-weight: 700; text-align: right; }
.item-desc { color: var(--muted); }
.item-more > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--accent); }
.item-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.check-row { display: flex; align-items: center; gap: .75rem; min-height: 44px; font-weight: 400; cursor: pointer; }
.check-row input { flex: none; width: 1.5rem; min-height: 0; height: 1.5rem; accent-color: var(--accent); }
.check-row span { flex: 1; }
.line { background: var(--surface); border: 1px solid var(--border); border-left: .3125rem solid var(--border-strong); border-radius: .75rem; padding: .75rem; display: grid; gap: .75rem; }
.line[data-state="invalid"] { border-color: var(--err-text); }
.line-name { font-weight: 700; }
.line-grid { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr); gap: .75rem; align-items: start; }
.line-notes { grid-column: 1 / -1; display: grid; gap: .25rem; }
.line-notes .hint:empty { display: none; }
.warranty { grid-column: 1 / -1; }
.line-foot { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.stepper { display: flex; gap: .5rem; }
.stepper input { flex: 1 1 0; width: 0; min-width: 3rem; padding-left: .25rem; padding-right: .25rem; text-align: center; }
.stepper button { flex: none; padding: .5rem; font-size: 1.25rem; }
.line-sum { font-weight: 700; }
.totals { display: grid; gap: .5rem; background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; }
.total-row { display: flex; justify-content: space-between; gap: .75rem; }
.total-row.grand { font-size: 1.25rem; font-weight: 700; }

@media (min-width: 48rem) {
  .wrap { padding-top: 2rem; }
  .line-grid { grid-template-columns: 11rem 11rem minmax(0, 1fr); }
  .warranty { grid-column: auto; }
  .line-notes { order: 1; }
  h1 { font-size: 1.75rem; }
  .sheet { align-items: center; }
  .sheet-inner { border-radius: 1rem; max-height: 90vh; max-height: 90dvh; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .bar-fill { transition: none; }
}
@media print {
  :root { --bg:#ffffff; --surface:#ffffff; --text:#000000; --muted:#222222; --border:#888888; --border-strong:#555555; }
  body { background: #fff; color: #000; }
  .no-print, .dock, .sheet, .howto, button, .page-head, .page-foot, .optional-note, .bar, .stage-progress { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .step { break-inside: avoid; border: 1px solid #555; box-shadow: none; }
  .proof, .tip { background: none; color: #000; border: 1px solid #555; }
  .msg { background: none; color: #000; border: 1px solid #555; }
  .links { display: block; }
  .linkbtn { display: block; min-height: 0; padding: 0; border: 0; border-radius: 0; background: none; color: #000; font-weight: 400; text-align: left; text-decoration: underline; }
  a[href]::after { content: " (" attr(href) ")"; }
}
</style>

      <h2 id="cheat-title" tabindex="-1">Памятка на заявку</h2>

<script>
(function () {
'use strict';

/* logic:start */
const STORAGE_KEY = 'masterGuide.progress.v1';
const PLACEHOLDERS = { order: '[НОМЕР ЗАЯВКИ]', phone: '[ТВОЙ ТЕЛЕФОН С 8]' };
const PLACEHOLDER_NAMES = { order: 'номер заявки', phone: 'свой телефон' };
const DONE_LABELS = { do: 'Сделано', buy: 'Куплено', know: 'Прочитал' };
const READY_TEXT = 'Можно писать «Доброе утро» диспетчеру';
const TOKEN_PATTERN = '\\{\\{\\s*([A-Za-z_][A-Za-z0-9_]*)\\s*\\}\\}';
const MAX_NUMBER = 1e9;
const NUMBER_HINTS = {
  empty: 'Впиши число цифрами. Если ничего не было — впиши 0.',
  format: 'Это не число. Впиши цифрами, например 10000.',
  negative: 'Число не может быть отрицательным.',
  big: 'Слишком большое число. Проверь, нет ли лишних цифр.'
};
const TEXT_EMPTY_HINT = 'Заполни это поле.';

function own(object, key) {
  return object !== null && typeof object === 'object' && Object.prototype.hasOwnProperty.call(object, key);
}

function storageKey() {
  return STORAGE_KEY;
}

function doneLabel(kind) {
  return own(DONE_LABELS, kind) ? DONE_LABELS[kind] : DONE_LABELS.do;
}

// Ссылка из данных кликабельна только если это https-адрес.
function safeUrl(url) {
  if (typeof url !== 'string') return '';
  const trimmed = url.trim();
  return /^https:\/\/\S+$/i.test(trimmed) ? trimmed : '';
}

// «**жирный**» -> [{text, bold}]. Ничего не превращается в HTML: страница сама создаёт узлы.
function parseBold(text) {
  const source = String(text === null || text === undefined ? '' : text);
  const out = [];
  const pattern = /\*\*(?=\S)([\s\S]*?\S)\*\*/g;
  let last = 0;
  let match;
  while ((match = pattern.exec(source)) !== null) {
    if (match.index > last) out.push({ text: source.slice(last, match.index), bold: false });
    out.push({ text: match[1], bold: true });
    last = match.index + match[0].length;
  }
  if (last < source.length) out.push({ text: source.slice(last), bold: false });
  return out;
}

// Текст с метками {{order}}, {{phone}} и т. п. -> куски [{text, token, filled}].
// Пустое значение известной метки даёт заметную заглушку (filled: false); неизвестная метка остаётся как есть.
function tokenSegments(text, values) {
  const source = String(text === null || text === undefined ? '' : text);
  const out = [];
  const pattern = new RegExp(TOKEN_PATTERN, 'g');
  let last = 0;
  let match;
  while ((match = pattern.exec(source)) !== null) {
    if (match.index > last) out.push({ text: source.slice(last, match.index), token: null, filled: true });
    const key = match[1];
    const raw = own(values, key) && values[key] !== null && values[key] !== undefined ? String(values[key]).trim() : '';
    if (raw !== '') {
      out.push({ text: raw, token: key, filled: true });
    } else if (own(PLACEHOLDERS, key)) {
      out.push({ text: PLACEHOLDERS[key], token: key, filled: false });
    } else {
      out.push({ text: match[0], token: null, filled: true });
    }
    last = match.index + match[0].length;
  }
  if (last < source.length) out.push({ text: source.slice(last), token: null, filled: true });
  return out;
}

function substituteTokens(text, values) {
  return tokenSegments(text, values).map(function (part) { return part.text; }).join('');
}

// Какие метки остались заглушками (для предупреждения при копировании).
function unfilledTokens(text, values) {
  const names = [];
  tokenSegments(text, values).forEach(function (part) {
    if (part.token && !part.filled && names.indexOf(part.token) === -1) names.push(part.token);
  });
  return names;
}

// Число из поля ввода: пробелы убираем, запятая = точка.
function parseNumber(raw) {
  const text = String(raw === null || raw === undefined ? '' : raw).replace(/[\s ]/g, '').replace(',', '.');
  if (text === '') return { ok: false, reason: 'empty' };
  if (/^-\d+(\.\d+)?$/.test(text)) return { ok: false, reason: 'negative' };
  if (!/^\d+(\.\d+)?$/.test(text)) return { ok: false, reason: 'format' };
  const value = Number(text);
  if (!isFinite(value) || value > MAX_NUMBER) return { ok: false, reason: 'big' };
  return { ok: true, value: value };
}

function formatNumber(value) {
  return String(Math.round(value * 100) / 100);
}

// Отчёт по данным: поля, вычисляемое (Всего − Запчасти) и шаблон текста берутся из описания отчёта.
// input — {ключ поля: введённая строка}; runtime — {order, phone}.
function computeReport(report, input, runtime) {
  const fields = Array.isArray(report && report.fields) ? report.fields : [];
  const computed = Array.isArray(report && report.computed) ? report.computed : [];
  const typed = input || {};
  const errors = {};
  const numbers = {};
  const values = {};
  const labels = {};

  fields.forEach(function (field) {
    labels[field.key] = field.label || field.key;
    const raw = own(typed, field.key) && typed[field.key] !== null && typed[field.key] !== undefined ? String(typed[field.key]) : '';
    if (field.type === 'number') {
      const parsed = parseNumber(raw);
      if (parsed.ok) {
        numbers[field.key] = parsed.value;
        values[field.key] = formatNumber(parsed.value);
      } else {
        errors[field.key] = { kind: parsed.reason === 'empty' ? 'empty' : 'invalid', message: NUMBER_HINTS[parsed.reason] };
      }
    } else if (raw.trim() === '') {
      errors[field.key] = { kind: 'empty', message: TEXT_EMPTY_HINT };
    } else {
      values[field.key] = raw.trim();
    }
  });

  computed.forEach(function (item) {
    if (item.op !== 'sub') return;
    if (!own(numbers, item.a) || !own(numbers, item.b)) return;
    if (numbers[item.b] > numbers[item.a]) {
      if (!own(errors, item.b)) {
        errors[item.b] = {
          kind: 'invalid',
          message: 'Проверь суммы: «' + (labels[item.b] || item.b) + '» больше, чем «' + (labels[item.a] || item.a) + '».'
        };
      }
      return;
    }
    const result = Math.round((numbers[item.a] - numbers[item.b]) * 100) / 100;
    numbers[item.key] = result;
    values[item.key] = formatNumber(result);
  });

  const ok = Object.keys(errors).length === 0;
  const all = { order: runtime && runtime.order, phone: runtime && runtime.phone };
  Object.keys(values).forEach(function (key) { all[key] = values[key]; });
  return {
    ok: ok,
    errors: errors,
    values: all,
    text: ok ? substituteTokens(report.template, all) : null,
    note: ok && report.note ? substituteTokens(report.note, all) : null
  };
}

function stepList(stage) {
  return stage && Array.isArray(stage.steps) ? stage.steps : [];
}

function isDone(progress, id) {
  return own(progress, id) && progress[id] === true;
}

function stageProgress(stage, progress) {
  let done = 0;
  let total = 0;
  stepList(stage).forEach(function (step) {
    total += 1;
    if (isDone(progress, step.id)) done += 1;
  });
  return { done: done, total: total };
}

function overallProgress(stages, progress) {
  let done = 0;
  let total = 0;
  (stages || []).forEach(function (stage) {
    const part = stageProgress(stage, progress);
    done += part.done;
    total += part.total;
  });
  return { done: done, total: total };
}

function stepsWord(count) {
  const n = Math.abs(Math.trunc(count));
  const last = n % 10;
  const lastTwo = n % 100;
  if (last === 1 && lastTwo !== 11) return 'шаг';
  if (last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14)) return 'шага';
  return 'шагов';
}

// «Готов к первой заявке» — обязательные шаги этапов 1–3 (s1, s2, s2b, s3 …); «Дополнительно» и поздние этапы не считаются.
function inReadinessScope(stageId) {
  const match = /^s(\d+)/.exec(String(stageId));
  return match !== null && Number(match[1]) >= 1 && Number(match[1]) <= 3;
}

function requiredSteps(stages) {
  const found = [];
  (stages || []).forEach(function (stage) {
    if (!inReadinessScope(stage && stage.id)) return;
    stepList(stage).forEach(function (step) {
      if (step.optional !== true) found.push(step);
    });
  });
  return found;
}

function readiness(stages, progress) {
  const required = requiredSteps(stages);
  const left = required.filter(function (step) { return !isDone(progress, step.id); }).length;
  const ready = left === 0;
  return {
    total: required.length,
    done: required.length - left,
    left: left,
    ready: ready,
    text: ready ? READY_TEXT : 'До заявок осталось ' + left + ' ' + stepsWord(left)
  };
}

function nextStepId(stages, progress) {
  const pending = requiredSteps(stages).filter(function (step) { return !isDone(progress, step.id); });
  return pending.length ? pending[0].id : null;
}

// Сохранённое состояние: {"<id шага>": true}. Всё чужое и испорченное отбрасывается.
function parseProgress(raw, knownIds) {
  const known = new Set(knownIds || []);
  const result = {};
  if (typeof raw !== 'string') return result;
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (error) {
    return result;
  }
  if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) return result;
  Object.keys(parsed).forEach(function (id) {
    if (known.has(id) && parsed[id] === true) result[id] = true;
  });
  return result;
}

function serializeProgress(progress, knownIds) {
  const known = new Set(knownIds || []);
  const result = {};
  Object.keys(progress || {}).forEach(function (id) {
    if (known.has(id) && progress[id] === true) result[id] = true;
  });
  return JSON.stringify(result);
}

// --- Прайс и акт: чистая логика ---
// Строка выбора держит цену и количество так, как они стоят в полях ввода (строками), поэтому
// проверка и расчёт работают прямо с тем, что набрал мастер. Деньги — целые рубли.
const MAX_QTY = 999;
const MAX_PRICE = 10000000;
const QTY_HINT = 'Количество — целое число от 1.';
const LAW_HINT = 'По закону цена не может превышать прайс';

function listOf(value) {
  return Array.isArray(value) ? value : [];
}

// Целое число из поля ввода (пробелы внутри игнорируются): {ok, value} или {ok: false, reason}.
function parseWhole(raw) {
  const parsed = parseNumber(raw);
  if (!parsed.ok) return parsed;
  if (Math.floor(parsed.value) !== parsed.value) return { ok: false, reason: 'fraction' };
  return parsed;
}

// Пустое поле = 0 (комплектующих нет, скидки нет).
function wholeOrZero(raw) {
  const text = String(raw === null || raw === undefined ? '' : raw).replace(/[\s ]/g, '');
  return text === '' ? { ok: true, value: 0 } : parseWhole(raw);
}

function normalizeQuery(text) {
  return String(text === null || text === undefined ? '' : text).toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
}

// Поиск по названию (слово в любом месте) и по номеру (с начала номера); все слова запроса должны найтись.
function searchItems(items, query, group) {
  const words = normalizeQuery(query).split(' ').filter(function (word) { return word !== ''; });
  const wanted = group ? String(group) : '';
  return listOf(items).filter(function (item) {
    if (wanted !== '' && item.group !== wanted) return false;
    const name = normalizeQuery(item.name);
    const number = normalizeQuery(item.no);
    return words.every(function (word) { return name.indexOf(word) !== -1 || number.indexOf(word) === 0; });
  });
}

function groupsOf(items) {
  const found = [];
  listOf(items).forEach(function (item) {
    if (found.indexOf(item.group) === -1) found.push(item.group);
  });
  return found;
}

function priceLabel(kind, price, currency) {
  const unit = currency || '₽';
  if (kind === 'fixed' && typeof price === 'number') return price + ' ' + unit;
  if (kind === 'from' && typeof price === 'number') return 'от ' + price + ' ' + unit;
  if (kind === 'na') return 'недоступно';
  return 'уточнять';
}

// Позиция прайса -> строка выбора; «недоступно» добавить нельзя (null).
function makeLine(item) {
  if (!item || item.kind === 'na') return null;
  const priced = (item.kind === 'fixed' || item.kind === 'from') && typeof item.price === 'number';
  return {
    key: 'i:' + item.id,
    name: String(item.name),
    no: item.no === null || item.no === undefined ? '' : String(item.no),
    kind: priced ? item.kind : 'ask',
    base: priced ? item.price : null,
    price: priced ? String(item.price) : '',
    hint: '',
    floor: null,
    qty: '1',
    warranty: ''
  };
}

// Ячейка матрицы: число — точная цена, "ask" — цену называют на месте, объект {hint, from} — то же, но
// с подсказкой у поля цены и нижней границей (ниже — предупреждение); всё остальное — недоступно.
function cellKind(matrix, rowId, columnId) {
  const row = listOf(matrix && matrix.rows).find(function (candidate) { return candidate.id === rowId; });
  const prices = row && row.prices && typeof row.prices === 'object' ? row.prices : {};
  const cell = own(prices, columnId) ? prices[columnId] : null;
  if (typeof cell === 'number' && isFinite(cell) && cell >= 0 && Math.floor(cell) === cell) return { kind: 'fixed', price: cell };
  if (cell === 'ask') return { kind: 'ask', price: null };
  if (cell !== null && typeof cell === 'object' && !Array.isArray(cell) && typeof cell.hint === 'string' && cell.hint.trim() !== '') {
    const floor = typeof cell.from === 'number' && isFinite(cell.from) && cell.from >= 0 && Math.floor(cell.from) === cell.from ? cell.from : null;
    return { kind: 'ask', price: null, hint: cell.hint.trim(), from: floor };
  }
  return { kind: 'na', price: null };
}

// Отмеченные услуги выбранной модели -> строки «<услуга> — <модель>» в порядке столбцов матрицы.
function matrixLines(matrix, rowId, columnIds) {
  const row = listOf(matrix && matrix.rows).find(function (candidate) { return candidate.id === rowId; });
  if (!row) return [];
  const wanted = listOf(columnIds);
  const lines = [];
  listOf(matrix.columns).forEach(function (column) {
    if (wanted.indexOf(column.id) === -1) return;
    const cell = cellKind(matrix, rowId, column.id);
    if (cell.kind === 'na') return;
    lines.push({
      key: 'm:' + matrix.id + ':' + rowId + ':' + column.id,
      name: column.name + ' — ' + row.label,
      no: '',
      kind: cell.kind,
      base: cell.price,
      price: cell.kind === 'fixed' ? String(cell.price) : '',
      hint: typeof cell.hint === 'string' ? cell.hint : '',
      floor: typeof cell.from === 'number' ? cell.from : null,
      qty: '1',
      warranty: ''
    });
  });
  return lines;
}

// Добавляет новые строки к выбранным; та, что уже выбрана, остаётся как есть (с тем, что в ней набрали).
function mergeLines(current, incoming) {
  const lines = listOf(current).slice();
  const keys = new Set(lines.map(function (line) { return line.key; }));
  let added = 0;
  let skipped = 0;
  listOf(incoming).forEach(function (candidate) {
    if (keys.has(candidate.key)) {
      skipped += 1;
      return;
    }
    keys.add(candidate.key);
    lines.push(candidate);
    added += 1;
  });
  return { lines: lines, added: added, skipped: skipped };
}

// Шаги «+» и «−» у количества: не ниже 1 и не выше MAX_QTY; непонятное значение считается нулём.
function stepQty(raw, delta) {
  const parsed = parseWhole(raw);
  const current = parsed.ok ? parsed.value : 0;
  return String(Math.min(MAX_QTY, Math.max(1, current + delta)));
}

// Ошибки полей строки: {qty, price}, каждое — текст подсказки или null.
function lineFieldErrors(line) {
  const result = { qty: null, price: null };

  const qty = parseWhole(line.qty);
  if (!qty.ok || qty.value < 1) {
    result.qty = QTY_HINT;
  } else if (qty.value > MAX_QTY) {
    result.qty = 'Слишком много. Проверь количество: не больше ' + MAX_QTY + '.';
  }

  const price = parseWhole(line.price);
  if (!price.ok) {
    result.price = price.reason === 'empty' ? 'Впиши цену за единицу.' : 'Цена — целое число рублей, например 1500.';
  } else if (price.value > MAX_PRICE) {
    result.price = 'Слишком большая цена. Проверь, нет ли лишних цифр.';
  } else if (line.kind === 'fixed' && typeof line.base === 'number' && price.value > line.base) {
    result.price = LAW_HINT + ': не больше ' + line.base + '.';
  } else if (line.kind === 'ask' && price.value <= 0) {
    result.price = 'Для этой услуги цена не фиксирована — впиши цену больше нуля.';
  }
  return result;
}

// Цена ниже ориентира прайса (нижней границы из ячейки-объекта): предупреждение, итог это не блокирует.
function lineWarning(line) {
  if (typeof line.floor !== 'number' || line.floor <= 0) return null;
  if (lineFieldErrors(line).price !== null) return null;
  const price = parseWhole(line.price).value;
  return price < line.floor
    ? 'Цена ниже ориентира прайса (от ' + line.floor + '). Если так и задумано — оставь, это только предупреждение.'
    : null;
}

function lineError(line) {
  const found = lineFieldErrors(line);
  return found.price || found.qty || null;
}

// Сумма строки: цена × количество; пока в строке есть ошибка — null.
function lineSum(line) {
  if (lineError(line) !== null) return null;
  return parseWhole(line.price).value * parseWhole(line.qty).value;
}

// Итог акта. Скидка в процентах берётся от стоимости услуг (комплектующие идут отдельно, по чекам) и
// округляется до рубля к ближайшему целому, «половина» — вверх: 0,5 -> 1. Целочисленная арифметика, без дробей.
// К оплате = услуги − скидка + комплектующие. Пока есть ошибки или список пуст, итоги не считаются (null).
function computeAct(lines, partsRaw, discountRaw) {
  const list = listOf(lines);
  const errors = { lines: {}, parts: null, discount: null };
  const lineSums = {};
  let services = 0;
  list.forEach(function (line) {
    const message = lineError(line);
    if (message !== null) {
      errors.lines[line.key] = message;
    } else {
      lineSums[line.key] = lineSum(line);
      services += lineSums[line.key];
    }
  });

  const parts = wholeOrZero(partsRaw);
  if (!parts.ok) errors.parts = 'Комплектующие — целое число рублей, 0 или больше.';
  const percent = wholeOrZero(discountRaw);
  if (!percent.ok || percent.value > 100) errors.discount = 'Скидка — целое число процентов от 0 до 100.';

  const empty = list.length === 0;
  const ok = !empty && Object.keys(errors.lines).length === 0 && errors.parts === null && errors.discount === null;
  const result = {
    ok: ok,
    empty: empty,
    errors: errors,
    lineSums: lineSums,
    services: null,
    parts: parts.ok ? parts.value : null,
    discountPct: percent.ok && percent.value <= 100 ? percent.value : null,
    discount: null,
    total: null
  };
  if (ok) {
    result.services = services;
    result.discount = Math.floor((services * percent.value + 50) / 100);
    result.total = services - result.discount + parts.value;
  }
  return result;
}

// Текст для переписывания в бланк; null, пока итог не посчитан.
function actText(lines, act, currency) {
  if (!act || !act.ok) return null;
  const unit = currency || '₽';
  const rows = listOf(lines).map(function (line, index) {
    const price = parseWhole(line.price).value;
    const qty = parseWhole(line.qty).value;
    const warranty = String(line.warranty === null || line.warranty === undefined ? '' : line.warranty).replace(/\s+/g, ' ').trim();
    return (index + 1) + '. ' + line.name + ' — ' + price + ' × ' + qty + ' = ' + act.lineSums[line.key] + (warranty ? ' — ' + warranty : '');
  });
  rows.push('');
  rows.push('Стоимость услуг: ' + act.services + ' ' + unit);
  rows.push('Стоимость комплектующих: ' + act.parts + ' ' + unit);
  rows.push('Скидка (' + act.discountPct + '%): ' + act.discount + ' ' + unit);
  rows.push('К оплате: ' + act.total + ' ' + unit);
  return rows.join('\n');
}
/* logic:end */

// ---------------------------------------------------------------------------
// Страница. Данные вставляются только через textContent и createElement.
// ---------------------------------------------------------------------------

const KIND_LABELS = { do: 'Действие', buy: 'Покупка', know: 'Нужно знать' };

function byId(id) {
  return document.getElementById(id);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function appendRich(parent, text) {
  parseBold(text).forEach(function (part) {
    if (part.bold) {
      parent.appendChild(el('strong', null, part.text));
    } else {
      parent.appendChild(document.createTextNode(part.text));
    }
  });
  return parent;
}

function richEl(tag, className, text) {
  return appendRich(el(tag, className), text);
}

function asList(value) {
  return Array.isArray(value) ? value : [];
}

// --- хранилище: каждое обращение в try/catch, без него страница работает целиком ---
let storageWorks = true;

function readStored(key) {
  try {
    return window.localStorage.getItem(key);
  } catch (error) {
    storageWorks = false;
    return null;
  }
}

function writeStored(key, value) {
  try {
    window.localStorage.setItem(key, value);
    return true;
  } catch (error) {
    storageWorks = false;
    return false;
  }
}

function probeStorage() {
  try {
    const probe = 'masterGuide.probe';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
  } catch (error) {
    storageWorks = false;
  }
}

// --- данные ---
function loadData() {
  const node = byId('guide-data');
  if (!node) return null;
  try {
    const parsed = JSON.parse(node.textContent);
    return parsed && typeof parsed === 'object' ? parsed : null;
  } catch (error) {
    return null;
  }
}

const data = loadData();

function showFatal(message) {
  const app = byId('app');
  clear(app);
  app.appendChild(el('p', 'storage-note', message));
}

if (!data || !Array.isArray(data.stages)) {
  showFatal('Не удалось прочитать данные гайда. Открой файл заново или попроси новую версию.');
  return;
}

const stages = data.stages;
const cheatsheet = data.cheatsheet && typeof data.cheatsheet === 'object' ? data.cheatsheet : null;
const pricelist = data.pricelist && typeof data.pricelist === 'object' ? data.pricelist : null;
const knownIds = [];
stages.forEach(function (stage) {
  stepList(stage).forEach(function (step) { knownIds.push(step.id); });
});

// Номер заявки и телефон живут только в памяти открытой страницы.
const runtime = { order: '', phone: '' };
const liveViews = [];

function refreshLive() {
  liveViews.forEach(function (render) { render(); });
}

probeStorage();
const storedRaw = readStored(STORAGE_KEY);
let progress = parseProgress(storedRaw, knownIds);
const firstRun = storedRaw === null;

function saveProgress() {
  writeStored(STORAGE_KEY, serializeProgress(progress, knownIds));
  byId('storage-note').hidden = storageWorks;
}

// --- копирование ---
function copyText(text) {
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
    }
  } catch (error) {
    // нет буфера обмена — ниже подскажем скопировать вручную
  }
  return Promise.resolve(false);
}

function selectNode(node) {
  try {
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(node);
    selection.removeAllRanges();
    selection.addRange(range);
  } catch (error) {
    // выделение недоступно — подсказка всё равно показана
  }
}

function say(status, message) {
  status.textContent = message;
  if (status.sayTimer) window.clearTimeout(status.sayTimer);
  status.sayTimer = window.setTimeout(function () { status.textContent = ''; }, 8000);
}

// getCopy() -> {text, unfilled: [имена меток]}; target — узел с текстом для ручного выделения.
function copyBlock(getCopy, target, label) {
  const row = el('div', 'actions');
  const button = el('button', null, label || 'Скопировать');
  button.type = 'button';
  const status = el('span', 'copy-status');
  status.setAttribute('role', 'status');
  button.addEventListener('click', function () {
    const payload = getCopy();
    if (!payload.text) {
      say(status, 'Пока нечего копировать.');
      return;
    }
    copyText(payload.text).then(function (copied) {
      if (copied) {
        if (payload.unfilled.length) {
          const names = payload.unfilled.map(function (name) { return PLACEHOLDER_NAMES[name] || name; });
          say(status, 'Скопировано. В тексте осталась заглушка — впиши ' + names.join(' и ') + ' в Памятке.');
        } else {
          say(status, 'Скопировано');
        }
      } else {
        selectNode(target);
        say(status, 'Скопируй вручную: текст выделен');
      }
    });
  });
  row.appendChild(button);
  row.appendChild(status);
  return row;
}

function renderMessage(node, raw) {
  clear(node);
  tokenSegments(raw, runtime).forEach(function (part) {
    if (part.token && !part.filled) {
      node.appendChild(el('mark', 'ph', part.text));
    } else {
      node.appendChild(document.createTextNode(part.text));
    }
  });
}

function messageBlock(label, raw) {
  const box = el('div', 'send');
  if (label) box.appendChild(el('p', 'send-label', label));
  const pre = el('pre', 'msg');
  box.appendChild(pre);
  box.appendChild(copyBlock(function () {
    return { text: substituteTokens(raw, runtime), unfilled: unfilledTokens(raw, runtime) };
  }, pre));
  liveViews.push(function () { renderMessage(pre, raw); });
  renderMessage(pre, raw);
  return box;
}

// --- шаги и этапы ---
const stepRefs = {};
const stageRefs = [];

function renderStep(step) {
  const card = el('article', 'step');
  card.id = 'step-' + step.id;
  const kindLabel = KIND_LABELS[step.kind];
  if (kindLabel) card.appendChild(el('p', 'kind', kindLabel));
  const title = richEl('h3', 'step-title', step.title);
  title.tabIndex = -1;
  card.appendChild(title);
  if (step.lead) card.appendChild(richEl('p', 'lead', step.lead));

  const points = asList(step.points);
  if (points.length) {
    const list = el(step.kind === 'do' ? 'ol' : 'ul', 'points');
    points.forEach(function (point) { list.appendChild(richEl('li', null, point)); });
    card.appendChild(list);
  }

  asList(step.send).forEach(function (message) {
    card.appendChild(messageBlock(message.label ? 'Сообщение в чат: ' + message.label : 'Сообщение в чат', message.text));
  });

  const links = asList(step.links);
  if (links.length) {
    const row = el('div', 'links');
    links.forEach(function (link) {
      const href = safeUrl(link.url);
      if (!href) return;
      const anchor = el('a', 'linkbtn', link.label || href);
      anchor.href = href;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      row.appendChild(anchor);
    });
    if (row.firstChild) card.appendChild(row);
  }

  if (step.tip) {
    const tip = el('aside', 'tip');
    tip.appendChild(el('strong', null, 'Совет. '));
    appendRich(tip, step.tip);
    card.appendChild(tip);
  }
  if (step.proof) card.appendChild(richEl('p', 'proof', step.proof));

  const mark = el('button', 'mark', doneLabel(step.kind));
  mark.type = 'button';
  mark.setAttribute('aria-pressed', 'false');
  mark.addEventListener('click', function () {
    if (isDone(progress, step.id)) {
      delete progress[step.id];
    } else {
      progress[step.id] = true;
    }
    saveProgress();
    refresh();
  });
  card.appendChild(mark);

  stepRefs[step.id] = { card: card, mark: mark, title: title };
  return card;
}

function progressBar(label) {
  const bar = el('div', 'bar');
  bar.setAttribute('role', 'progressbar');
  bar.setAttribute('aria-label', label);
  bar.setAttribute('aria-valuemin', '0');
  bar.setAttribute('aria-valuemax', '1');
  bar.setAttribute('aria-valuenow', '0');
  bar.appendChild(el('div', 'bar-fill'));
  return bar;
}

function setBar(bar, part) {
  bar.setAttribute('aria-valuemax', String(part.total));
  bar.setAttribute('aria-valuenow', String(part.done));
  bar.firstChild.style.width = (part.total ? Math.round((part.done / part.total) * 100) : 0) + '%';
}

function renderStage(stage, index) {
  const stageId = String(stage.id || 'x' + index);
  const section = el('section', 'stage');
  section.id = 'stage-' + stageId;
  section.setAttribute('aria-labelledby', 'stage-title-' + stageId);

  const head = el('div', 'stage-head');
  const title = richEl('h2', null, stage.title);
  title.id = 'stage-title-' + stageId;
  title.tabIndex = -1;
  const counter = el('p', 'stage-progress');
  head.appendChild(title);
  head.appendChild(counter);
  section.appendChild(head);

  const bar = progressBar('Прогресс этапа: ' + (stage.title || stageId));
  section.appendChild(bar);
  if (stage.intro) section.appendChild(richEl('p', 'stage-intro', stage.intro));

  const steps = stepList(stage);
  steps.filter(function (step) { return step.optional !== true; }).forEach(function (step) {
    section.appendChild(renderStep(step));
  });
  const optional = steps.filter(function (step) { return step.optional === true; });
  if (optional.length) {
    section.appendChild(el('h3', 'optional-head', 'Дополнительно'));
    section.appendChild(el('p', 'optional-note', 'Необязательно: можно пропустить, к первой заявке это не нужно.'));
    optional.forEach(function (step) { section.appendChild(renderStep(step)); });
  }

  // пункт оглавления
  const item = el('li');
  const anchor = el('a');
  anchor.href = '#stage-' + stageId;
  anchor.appendChild(el('span', null, stage.title || stageId));
  const tocCount = el('span', 'toc-count');
  anchor.appendChild(tocCount);
  anchor.addEventListener('click', function () { byId('toc-box').open = false; });
  item.appendChild(anchor);
  byId('toc').appendChild(item);

  stageRefs.push({ stage: stage, counter: counter, bar: bar, tocCount: tocCount });
  return section;
}

function refresh() {
  const overall = overallProgress(stages, progress);
  byId('overall-text').textContent = 'Пройдено шагов: ' + overall.done + ' из ' + overall.total;
  setBar(byId('overall-bar'), overall);

  stageRefs.forEach(function (ref) {
    const part = stageProgress(ref.stage, progress);
    ref.counter.textContent = part.done + ' из ' + part.total;
    ref.tocCount.textContent = part.done + '/' + part.total;
    setBar(ref.bar, part);
  });

  Object.keys(stepRefs).forEach(function (id) {
    const pressed = isDone(progress, id);
    stepRefs[id].mark.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    stepRefs[id].card.classList.toggle('done', pressed);
  });

  const state = readiness(stages, progress);
  byId('banner-text').textContent = state.text;
  byId('banner').setAttribute('data-state', state.ready ? 'ready' : 'todo');
  byId('banner-next').hidden = state.ready;
}

function goToNextStep() {
  const id = nextStepId(stages, progress);
  if (!id || !stepRefs[id]) return;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  stepRefs[id].card.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
  stepRefs[id].title.focus({ preventScroll: true });
}

function setupReset() {
  const resetButton = byId('reset');
  const box = byId('reset-box');
  const status = byId('reset-status');
  resetButton.addEventListener('click', function () {
    box.hidden = false;
    resetButton.hidden = true;
    byId('reset-no').focus();
  });
  byId('reset-no').addEventListener('click', function () {
    box.hidden = true;
    resetButton.hidden = false;
    resetButton.focus();
  });
  byId('reset-yes').addEventListener('click', function () {
    progress = {};
    saveProgress();
    refresh();
    box.hidden = true;
    resetButton.hidden = false;
    resetButton.focus();
    say(status, 'Отметки стёрты');
  });
}

// --- Памятка на заявку ---
function textField(id, labelText, kind, placeholder) {
  const wrap = el('div', 'field');
  const label = el('label', null, labelText);
  label.setAttribute('for', id);
  const input = kind === 'textarea' ? el('textarea') : el('input');
  input.id = id;
  if (kind === 'textarea') {
    input.rows = 2;
  } else {
    input.type = kind === 'tel' ? 'tel' : kind === 'search' ? 'search' : 'text';
    if (kind === 'decimal') input.setAttribute('inputmode', 'decimal');
    if (kind === 'numeric') input.setAttribute('inputmode', 'numeric');
  }
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('spellcheck', 'false');
  if (placeholder) input.placeholder = placeholder;
  wrap.appendChild(label);
  wrap.appendChild(input);
  return { wrap: wrap, input: input };
}

function renderChain(chain) {
  const section = el('section', 'sheet-section');
  section.appendChild(el('h3', null, 'Что нажать и что написать'));
  const list = el('ol', 'chain');
  chain.forEach(function (row) {
    const item = el('li', 'chain-item');
    item.appendChild(el('p', 'chip', row.when));
    if (row.app) {
      const line = el('p');
      line.appendChild(document.createTextNode('В приложении нажми: '));
      line.appendChild(el('span', 'chip', '«' + row.app + '»'));
      item.appendChild(line);
    }
    if (row.chat) item.appendChild(messageBlock('В чат мастера напиши:', row.chat));
    list.appendChild(item);
  });
  section.appendChild(list);
  return section;
}

function renderReport(report, position) {
  const box = el('details', 'report');
  if (position === 0) box.open = true;
  box.appendChild(el('summary', null, report.title));
  const body = el('div', 'report-body');
  box.appendChild(body);

  const inputs = {};
  const hints = {};
  asList(report.fields).forEach(function (field) {
    const fieldId = 'rf-' + String(report.id) + '-' + String(field.key);
    const control = textField(fieldId, field.label, field.type === 'number' ? 'decimal' : 'textarea', null);
    const hint = el('p', 'hint');
    hint.id = fieldId + '-hint';
    control.input.setAttribute('aria-describedby', hint.id);
    control.wrap.appendChild(hint);
    body.appendChild(control.wrap);
    inputs[field.key] = control.input;
    hints[field.key] = hint;
  });

  const result = el('div', 'result');
  const wait = el('p', 'result-wait', 'Заполни поля — здесь появится готовый отчёт.');
  const ready = el('div', 'result');
  ready.hidden = true;
  const note = el('p', 'note');
  const pre = el('pre', 'msg');
  let current = { text: '', unfilled: [] };
  ready.appendChild(note);
  ready.appendChild(pre);
  ready.appendChild(copyBlock(function () { return current; }, pre));
  result.appendChild(wait);
  result.appendChild(ready);
  body.appendChild(result);

  function update() {
    const typed = {};
    Object.keys(inputs).forEach(function (key) { typed[key] = inputs[key].value; });
    const outcome = computeReport(report, typed, runtime);
    Object.keys(inputs).forEach(function (key) {
      const problem = outcome.errors[key];
      hints[key].textContent = problem ? problem.message : '';
      hints[key].setAttribute('data-state', problem ? problem.kind : 'ok');
      inputs[key].setAttribute('aria-invalid', problem && problem.kind === 'invalid' ? 'true' : 'false');
    });
    wait.hidden = outcome.ok;
    ready.hidden = !outcome.ok;
    clear(note);
    clear(pre);
    current = { text: '', unfilled: [] };
    if (!outcome.ok) return;

    note.hidden = !report.note;
    if (report.note) {
      tokenSegments(report.note, outcome.values).forEach(function (part) {
        note.appendChild(part.token ? el('strong', null, part.text) : document.createTextNode(part.text));
      });
    }
    tokenSegments(report.template, outcome.values).forEach(function (part) {
      if (part.token && !part.filled) {
        pre.appendChild(el('mark', 'ph', part.text));
      } else {
        pre.appendChild(document.createTextNode(part.text));
      }
    });
    current = { text: outcome.text, unfilled: unfilledTokens(report.template, outcome.values) };
  }

  Object.keys(inputs).forEach(function (key) { inputs[key].addEventListener('input', update); });
  liveViews.push(update);
  update();
  return box;
}

function renderCheatsheet() {
  const body = byId('cheat-body');
  const title = cheatsheet && cheatsheet.title ? cheatsheet.title : 'Памятка на заявку';
  byId('cheat-title').textContent = title;
  byId('cheat-open').textContent = title;
  if (!cheatsheet) {
    body.appendChild(el('p', 'result-wait', 'В этом файле нет данных для памятки.'));
    return;
  }

  const fields = el('section', 'fields');
  const order = textField('f-order', 'Номер заявки', 'text', 'как в приложении');
  const phone = textField('f-phone', 'Мой телефон с 8', 'tel', '8 9XX XXX-XX-XX');
  order.input.addEventListener('input', function () { runtime.order = order.input.value; refreshLive(); });
  phone.input.addEventListener('input', function () { runtime.phone = phone.input.value; refreshLive(); });
  fields.appendChild(order.wrap);
  fields.appendChild(phone.wrap);
  fields.appendChild(el('p', 'hint', 'Эти два поля нигде не сохраняются: закроешь страницу — пропадут.'));
  body.appendChild(fields);

  const chain = asList(cheatsheet.chain);
  if (chain.length) body.appendChild(renderChain(chain));

  const reports = asList(cheatsheet.reports);
  if (reports.length) {
    const section = el('section', 'sheet-section');
    section.appendChild(el('h3', null, 'Отчёты'));
    reports.forEach(function (report, position) { section.appendChild(renderReport(report, position)); });
    body.appendChild(section);
  }
}

// Панели (памятка, прайс) открываются поверх страницы; пока одна открыта, остальное неактивно (inert).
let activeSheet = null;
let sheetOpener = null;

function openSheet(entry) {
  sheetOpener = document.activeElement;
  activeSheet = entry;
  entry.sheet.hidden = false;
  byId('page').setAttribute('inert', '');
  byId('dock').setAttribute('inert', '');
  document.body.classList.add('sheet-open');
  entry.openButton.setAttribute('aria-expanded', 'true');
  entry.title.focus();
}

function closeSheet() {
  if (!activeSheet) return;
  const entry = activeSheet;
  activeSheet = null;
  entry.sheet.hidden = true;
  byId('page').removeAttribute('inert');
  byId('dock').removeAttribute('inert');
  document.body.classList.remove('sheet-open');
  entry.openButton.setAttribute('aria-expanded', 'false');
  // в Safari кнопка по нажатию не получает фокус: тогда opener — body, и фокус вернём на саму кнопку
  const back = sheetOpener && sheetOpener !== document.body && typeof sheetOpener.focus === 'function' ? sheetOpener : entry.openButton;
  back.focus();
}

function registerSheet(sheet, title, openButton, closeButton) {
  const entry = { sheet: sheet, title: title, openButton: openButton };
  openButton.addEventListener('click', function () { openSheet(entry); });
  closeButton.addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (event) {
    if (event.target === sheet) closeSheet();
  });
}

function setupSheet() {
  registerSheet(byId('cheat'), byId('cheat-title'), byId('cheat-open'), byId('cheat-close'));
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && activeSheet) closeSheet();
  });
}

// price:start
// --- Панель «Прайс и акт»: мастер выбирает оказанные услуги, страница считает акт и даёт текст для бланка.
// Выбор живёт только в памяти открытой страницы: на диск и в адрес он не попадает. ---
function option(value, label) {
  const node = el('option', null, label);
  node.value = value;
  return node;
}

function labeled(id, labelText, control) {
  const wrap = el('div', 'field');
  const label = el('label', null, labelText);
  label.setAttribute('for', id);
  control.id = id;
  wrap.appendChild(label);
  wrap.appendChild(control);
  return wrap;
}

function wholeInput(value) {
  const input = el('input');
  input.type = 'text';
  input.setAttribute('inputmode', 'numeric');
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('spellcheck', 'false');
  input.value = value;
  return input;
}

// state: 'invalid' — ошибка (красная), 'warn' — предупреждение (синяя): с ним итог считается.
function setHint(hint, input, message, state) {
  hint.textContent = message || '';
  hint.setAttribute('data-state', message ? state : 'ok');
  if (input) input.setAttribute('aria-invalid', message && state === 'invalid' ? 'true' : 'false');
}

function baseText(line, currency) {
  if (line.kind === 'fixed') return 'В прайсе: ' + priceLabel('fixed', line.base, currency) + '. Выше этой цены ставить нельзя.';
  if (line.kind === 'from') return 'В прайсе: ' + priceLabel('from', line.base, currency) + '.';
  if (line.hint) return 'В прайсе: ' + line.hint + '. Цену впиши сам(а).';
  return 'Цена не фиксирована — впиши сам(а).';
}

function setupPrice() {
  const currency = pricelist.currency || '₽';
  const items = asList(pricelist.items);
  const matrices = asList(pricelist.matrices);
  let selected = [];
  let views = [];
  let uid = 0;

  // каркас панели и кнопка рядом с «Памяткой на заявку»
  const sheet = el('section', 'sheet no-print');
  sheet.id = 'price';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('aria-labelledby', 'price-title');
  sheet.hidden = true;
  const frame = el('div', 'sheet-inner');
  const head = el('div', 'sheet-head');
  const title = el('h2', null, 'Прайс и акт');
  title.id = 'price-title';
  title.tabIndex = -1;
  const closeButton = el('button', null, 'Закрыть');
  closeButton.type = 'button';
  head.appendChild(title);
  head.appendChild(closeButton);
  const body = el('div', 'sheet-body');
  frame.appendChild(head);
  frame.appendChild(body);
  sheet.appendChild(frame);
  document.body.appendChild(sheet);

  const openButton = el('button', null, 'Прайс и акт');
  openButton.type = 'button';
  openButton.id = 'price-open';
  openButton.setAttribute('aria-haspopup', 'dialog');
  openButton.setAttribute('aria-expanded', 'false');
  openButton.setAttribute('aria-controls', 'price');
  byId('dock-row').appendChild(openButton);
  registerSheet(sheet, title, openButton, closeButton);

  // вводная строка и переход к списку
  const intro = el('section', 'sheet-section');
  const about = el('p', 'hint');
  about.appendChild(el('strong', null, pricelist.title || 'Прайс'));
  if (pricelist.note) about.appendChild(document.createTextNode(' ' + pricelist.note));
  const jump = el('button', null, '');
  jump.type = 'button';
  jump.style.justifySelf = 'start';
  intro.appendChild(about);
  intro.appendChild(jump);
  body.appendChild(intro);

  function addLines(lines, status) {
    const merged = mergeLines(selected, lines);
    selected = merged.lines;
    renderSelected();
    if (merged.added && !merged.skipped) {
      say(status, 'Добавлено в «Выбрано»');
    } else if (merged.added) {
      say(status, 'Добавлено: ' + merged.added + '. Уже были в списке: ' + merged.skipped + '.');
    } else {
      say(status, 'Уже в списке — количество меняется в «Выбрано».');
    }
  }

  // --- позиции прайса: поиск, группы, описание ---
  if (items.length) {
    const catalog = el('section', 'sheet-section');
    catalog.appendChild(el('h3', null, 'Прайс'));
    const tools = el('div', 'price-tools');
    const search = textField('price-search', 'Поиск по названию или номеру', 'search', 'например, диагностика');
    const groupSelect = el('select');
    groupSelect.appendChild(option('', 'Все группы'));
    groupsOf(items).forEach(function (group) { groupSelect.appendChild(option(group, group)); });
    const count = el('p', 'hint');
    count.setAttribute('role', 'status');
    tools.appendChild(search.wrap);
    tools.appendChild(labeled('price-group', 'Группа', groupSelect));
    tools.appendChild(count);
    catalog.appendChild(tools);
    const results = el('div', 'price-groups');
    catalog.appendChild(results);
    body.appendChild(catalog);

    const buildItem = function (item) {
      const card = el('li', 'price-item');
      const top = el('div', 'item-top');
      const names = el('div');
      names.appendChild(el('p', 'item-name', item.name));
      names.appendChild(el('p', 'item-no', '№ ' + item.no));
      top.appendChild(names);
      top.appendChild(el('p', 'item-price', priceLabel(item.kind, item.price, currency)));
      card.appendChild(top);
      if (item.description) {
        const more = el('details', 'item-more');
        more.appendChild(el('summary', null, 'Описание'));
        more.appendChild(el('p', 'item-desc', item.description));
        card.appendChild(more);
      }
      const actions = el('div', 'item-actions');
      const unavailable = item.kind === 'na';
      const add = el('button', null, unavailable ? 'недоступно' : 'Добавить');
      add.type = 'button';
      add.setAttribute('aria-label', (unavailable ? 'Недоступно: ' : 'Добавить: ') + item.name);
      const status = el('span', 'copy-status');
      status.setAttribute('role', 'status');
      if (unavailable) {
        add.disabled = true;
      } else {
        add.addEventListener('click', function () { addLines([makeLine(item)], status); });
      }
      actions.appendChild(add);
      actions.appendChild(status);
      card.appendChild(actions);
      return card;
    };

    const renderResults = function () {
      const found = searchItems(items, search.input.value, groupSelect.value);
      clear(results);
      count.textContent = found.length
        ? 'Найдено позиций: ' + found.length + ' из ' + items.length
        : 'Ничего не найдено. Попробуй другое слово или номер.';
      let list = null;
      let lastGroup = null;
      found.forEach(function (item) {
        if (list === null || item.group !== lastGroup) {
          lastGroup = item.group;
          results.appendChild(el('h4', 'group-head', item.group));
          list = el('ul', 'price-list');
          results.appendChild(list);
        }
        list.appendChild(buildItem(item));
      });
    };
    search.input.addEventListener('input', renderResults);
    groupSelect.addEventListener('change', renderResults);
    renderResults();
  }

  // --- таблицы «модель × услуга» ---
  if (matrices.length) {
    const section = el('section', 'sheet-section');
    section.appendChild(el('h3', null, 'Таблицы «модель × услуга»'));
    matrices.forEach(function (matrix, position) {
      const box = el('details', 'report');
      box.appendChild(el('summary', null, matrix.title));
      const content = el('div', 'report-body');
      box.appendChild(content);
      if (matrix.note) content.appendChild(el('p', 'hint', matrix.note));

      const rowSelect = el('select');
      rowSelect.appendChild(option('', '— выбери модель —'));
      asList(matrix.rows).forEach(function (row) { rowSelect.appendChild(option(row.id, row.label)); });
      content.appendChild(labeled('pm-' + position + '-row', 'Модель', rowSelect));

      const cells = el('div');
      content.appendChild(cells);
      const actions = el('div', 'item-actions');
      const add = el('button', null, 'Добавить отмеченные');
      add.type = 'button';
      const status = el('span', 'copy-status');
      status.setAttribute('role', 'status');
      actions.appendChild(add);
      actions.appendChild(status);
      content.appendChild(actions);

      const checkboxes = function () { return Array.prototype.slice.call(cells.querySelectorAll('input[type="checkbox"]')); };
      const renderCells = function () {
        clear(cells);
        const rowId = rowSelect.value;
        if (!rowId) {
          cells.appendChild(el('p', 'hint', 'Сначала выбери модель.'));
          return;
        }
        asList(matrix.columns).forEach(function (column, index) {
          const cell = cellKind(matrix, rowId, column.id);
          const label = el('label', 'check-row');
          const mark = el('input');
          mark.type = 'checkbox';
          mark.id = 'pm-' + position + '-c' + index;
          mark.value = column.id;
          label.setAttribute('for', mark.id);
          mark.disabled = cell.kind === 'na';
          let price = 'недоступно';
          if (cell.kind === 'fixed') price = priceLabel('fixed', cell.price, currency);
          if (cell.kind === 'ask') price = cell.hint || 'уточнять';
          label.appendChild(mark);
          label.appendChild(el('span', null, column.name + ' — ' + price));
          cells.appendChild(label);
        });
      };
      rowSelect.addEventListener('change', renderCells);
      add.addEventListener('click', function () {
        const rowId = rowSelect.value;
        if (!rowId) {
          say(status, 'Сначала выбери модель.');
          return;
        }
        const picked = checkboxes().filter(function (mark) { return mark.checked && !mark.disabled; })
          .map(function (mark) { return mark.value; });
        if (!picked.length) {
          say(status, 'Отметь хотя бы одну услугу.');
          return;
        }
        addLines(matrixLines(matrix, rowId, picked), status);
        checkboxes().forEach(function (mark) { mark.checked = false; });
      });
      renderCells();
      section.appendChild(box);
    });
    body.appendChild(section);
  }

  // --- «Выбрано»: количество, цена, гарантия ---
  const chosen = el('section', 'sheet-section');
  const chosenTitle = el('h3', null, 'Выбрано');
  chosenTitle.id = 'price-selected-title';
  chosenTitle.tabIndex = -1;
  const emptyNote = el('p', 'result-wait', 'Ничего не выбрано');
  const qtyNote = el('p', 'hint', 'Количество — только если услуга оказана столько раз.');
  qtyNote.id = 'price-qty-hint';
  const listNode = el('ol', 'price-list');
  chosen.appendChild(chosenTitle);
  chosen.appendChild(emptyNote);
  chosen.appendChild(qtyNote);
  chosen.appendChild(listNode);
  body.appendChild(chosen);

  // комплектующие и скидка
  const extras = el('section', 'fields');
  const parts = textField('price-parts', 'Стоимость комплектующих, ' + currency, 'numeric', '0');
  const partsHint = el('p', 'hint');
  partsHint.id = 'price-parts-hint';
  parts.input.setAttribute('aria-describedby', partsHint.id);
  const discount = textField('price-discount', 'Скидка, %', 'numeric', '0');
  const discountHint = el('p', 'hint');
  discountHint.id = 'price-discount-hint';
  discount.input.setAttribute('aria-describedby', discountHint.id);
  extras.appendChild(parts.wrap);
  extras.appendChild(partsHint);
  extras.appendChild(discount.wrap);
  extras.appendChild(discountHint);
  body.appendChild(extras);

  // итог
  const totals = el('section', 'totals');
  totals.setAttribute('aria-live', 'polite');
  const totalRow = function (label, grand) {
    const row = el('p', grand ? 'total-row grand' : 'total-row');
    const value = el('strong');
    row.appendChild(el('span', null, label));
    row.appendChild(value);
    totals.appendChild(row);
    return value;
  };
  const servicesValue = totalRow('Стоимость услуг', false);
  const discountValue = totalRow('Скидка', false);
  const payValue = totalRow('К оплате', true);
  const blocked = el('p', 'hint');
  totals.appendChild(blocked);
  body.appendChild(totals);

  // текст для бланка
  const output = el('section', 'sheet-section');
  output.appendChild(el('h3', null, 'Текст для бланка'));
  output.appendChild(el('p', 'tip', 'В бланк пиши от руки красным; в пустых полях прочерки; только оказанные услуги'));
  const wait = el('p', 'result-wait', 'Исправь ошибки выше — тогда здесь появится текст для бланка.');
  const pre = el('pre', 'msg');
  let current = { text: '', unfilled: [] };
  output.appendChild(wait);
  output.appendChild(pre);
  output.appendChild(copyBlock(function () { return current; }, pre, 'Скопировать список для бланка'));
  body.appendChild(output);

  // «Очистить» — только после подтверждения
  const clearRow = el('section', 'sheet-section');
  const clearButton = el('button', 'btn-danger', 'Очистить');
  clearButton.type = 'button';
  clearButton.style.justifySelf = 'start';
  const confirmBox = el('div', 'reset-box');
  confirmBox.hidden = true;
  confirmBox.appendChild(el('p', null, 'Убрать все выбранные услуги и суммы? Это нельзя отменить.'));
  const confirmActions = el('div', 'actions');
  const confirmYes = el('button', 'btn-danger', 'Да, очистить');
  confirmYes.type = 'button';
  const confirmNo = el('button', null, 'Отмена');
  confirmNo.type = 'button';
  confirmActions.appendChild(confirmYes);
  confirmActions.appendChild(confirmNo);
  confirmBox.appendChild(confirmActions);
  clearRow.appendChild(clearButton);
  clearRow.appendChild(confirmBox);
  body.appendChild(clearRow);

  function buildLine(line) {
    uid += 1;
    const id = 'pl' + uid;
    const card = el('li', 'line');
    const nameRow = el('p', 'line-name', line.name);
    if (line.no) nameRow.appendChild(el('span', 'item-no', ' · № ' + line.no));
    card.appendChild(nameRow);
    const grid = el('div', 'line-grid');

    const qtyWrap = el('div', 'field');
    const qtyLabel = el('label', null, 'Количество');
    qtyLabel.setAttribute('for', id + '-qty');
    const stepper = el('div', 'stepper');
    const minus = el('button', null, '−');
    minus.type = 'button';
    minus.setAttribute('aria-label', 'Уменьшить количество: ' + line.name);
    const qtyInput = wholeInput(line.qty);
    qtyInput.id = id + '-qty';
    const plus = el('button', null, '+');
    plus.type = 'button';
    plus.setAttribute('aria-label', 'Увеличить количество: ' + line.name);
    stepper.appendChild(minus);
    stepper.appendChild(qtyInput);
    stepper.appendChild(plus);
    qtyWrap.appendChild(qtyLabel);
    qtyWrap.appendChild(stepper);

    const priceWrap = el('div', 'field');
    const priceTitle = el('label', null, 'Цена за единицу, ' + currency);
    priceTitle.setAttribute('for', id + '-price');
    const priceInput = wholeInput(line.price);
    priceInput.id = id + '-price';
    priceWrap.appendChild(priceTitle);
    priceWrap.appendChild(priceInput);

    // подсказки и ошибки — одной строкой на всю ширину под полями количества и цены
    const notes = el('div', 'line-notes');
    const qtyError = el('p', 'hint');
    qtyError.id = id + '-qty-error';
    const priceBase = el('p', 'hint', baseText(line, currency));
    priceBase.id = id + '-price-base';
    const priceError = el('p', 'hint');
    priceError.id = id + '-price-error';
    notes.appendChild(priceBase);
    notes.appendChild(priceError);
    notes.appendChild(qtyError);
    qtyInput.setAttribute('aria-describedby', 'price-qty-hint ' + qtyError.id);
    priceInput.setAttribute('aria-describedby', priceBase.id + ' ' + priceError.id);

    const warrantyWrap = el('div', 'field warranty');
    const warrantyLabel = el('label', null, 'Гарантия');
    warrantyLabel.setAttribute('for', id + '-warranty');
    const warrantyInput = el('input');
    warrantyInput.type = 'text';
    warrantyInput.id = id + '-warranty';
    warrantyInput.placeholder = 'срок, если есть';
    warrantyInput.setAttribute('autocomplete', 'off');
    warrantyInput.value = line.warranty;
    warrantyWrap.appendChild(warrantyLabel);
    warrantyWrap.appendChild(warrantyInput);

    grid.appendChild(qtyWrap);
    grid.appendChild(priceWrap);
    grid.appendChild(notes);
    grid.appendChild(warrantyWrap);
    card.appendChild(grid);

    const foot = el('div', 'line-foot');
    const sum = el('p', 'line-sum');
    const remove = el('button', 'btn-danger', 'Удалить');
    remove.type = 'button';
    remove.setAttribute('aria-label', 'Удалить: ' + line.name);
    foot.appendChild(sum);
    foot.appendChild(remove);
    card.appendChild(foot);

    qtyInput.addEventListener('input', function () { line.qty = qtyInput.value; updateAll(); });
    priceInput.addEventListener('input', function () { line.price = priceInput.value; updateAll(); });
    warrantyInput.addEventListener('input', function () { line.warranty = warrantyInput.value; updateAll(); });
    minus.addEventListener('click', function () { qtyInput.value = stepQty(qtyInput.value, -1); line.qty = qtyInput.value; updateAll(); });
    plus.addEventListener('click', function () { qtyInput.value = stepQty(qtyInput.value, 1); line.qty = qtyInput.value; updateAll(); });
    remove.addEventListener('click', function () {
      selected = selected.filter(function (candidate) { return candidate !== line; });
      renderSelected();
      chosenTitle.focus();
    });

    views.push({ line: line, card: card, sum: sum, qtyInput: qtyInput, qtyError: qtyError, priceInput: priceInput, priceError: priceError });
    return card;
  }

  function money(value) {
    return value === null ? '—' : value + ' ' + currency;
  }

  function updateAll() {
    const has = selected.length > 0;
    [qtyNote, listNode, extras, totals, output, clearRow].forEach(function (node) { node.hidden = !has; });
    emptyNote.hidden = has;
    jump.hidden = !has;
    if (!has) confirmBox.hidden = true;
    chosenTitle.textContent = has ? 'Выбрано (' + selected.length + ')' : 'Выбрано';
    jump.textContent = 'Выбрано: ' + selected.length + ' — к списку';

    const act = computeAct(selected, parts.input.value, discount.input.value);
    views.forEach(function (view) {
      const problems = lineFieldErrors(view.line);
      setHint(view.qtyError, view.qtyInput, problems.qty, 'invalid');
      setHint(view.priceError, view.priceInput, problems.price || lineWarning(view.line), problems.price ? 'invalid' : 'warn');
      view.card.setAttribute('data-state', problems.qty || problems.price ? 'invalid' : 'ok');
      view.sum.textContent = 'Сумма: ' + money(lineSum(view.line));
    });
    setHint(partsHint, parts.input, act.errors.parts, 'invalid');
    setHint(discountHint, discount.input, act.errors.discount, 'invalid');

    servicesValue.textContent = money(act.services);
    discountValue.textContent = act.discount === null ? '—' : act.discount + ' ' + currency + ' (' + act.discountPct + '%)';
    payValue.textContent = money(act.total);
    setHint(blocked, null, !act.ok && has ? 'Итог не считается, пока есть ошибки.' : '', 'invalid');

    const text = actText(selected, act, currency);
    current = { text: text || '', unfilled: [] };
    pre.textContent = text || '';
    pre.hidden = !text;
    wait.hidden = !!text || !has;
  }

  function renderSelected() {
    clear(listNode);
    views = [];
    selected.forEach(function (line) { listNode.appendChild(buildLine(line)); });
    updateAll();
  }

  parts.input.addEventListener('input', updateAll);
  discount.input.addEventListener('input', updateAll);
  jump.addEventListener('click', function () {
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    chosenTitle.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    chosenTitle.focus({ preventScroll: true });
  });
  clearButton.addEventListener('click', function () {
    confirmBox.hidden = false;
    clearButton.hidden = true;
    confirmNo.focus();
  });
  confirmNo.addEventListener('click', function () {
    confirmBox.hidden = true;
    clearButton.hidden = false;
    clearButton.focus();
  });
  confirmYes.addEventListener('click', function () {
    selected = [];
    parts.input.value = '';
    discount.input.value = '';
    confirmBox.hidden = true;
    clearButton.hidden = false;
    renderSelected();
    chosenTitle.focus();
  });
  renderSelected();
}
// price:end

// --- запуск ---
const app = byId('app');
renderHowto(app);
stages.forEach(function (stage, index) { app.appendChild(renderStage(stage, index)); });
renderCheatsheet();
setupSheet();
if (pricelist && (asList(pricelist.items).length || asList(pricelist.matrices).length)) setupPrice();
setupReset();
byId('banner-next').addEventListener('click', goToNextStep);
byId('storage-note').hidden = storageWorks;
refresh();
})();
</script>
</body>
</html>

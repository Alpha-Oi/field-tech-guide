<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="454" viewBox="0 0 880 454" role="img" aria-labelledby="chart-title chart-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="chart-title">Шагов по этапам</title>
<desc id="chart-desc">Горизонтальный столбчатый график: число шагов в каждом из 9 этапов гайда. Всего 84 шага, из них 7 дополнительных.</desc>
<rect class="bg" x="0.5" y="0.5" width="879" height="453" rx="12" fill="#ffffff" stroke="#d0d6df"/>
<text class="heading" x="24" y="44" font-size="22" font-weight="700" fill="#151a21">Шагов по этапам</text>
<text class="summary" x="24" y="70" font-size="15" fill="#4b5565">Всего 84 шага, из них 7 дополнительных</text>
<rect class="swatch req" x="24" y="86" width="14" height="14" fill="#1d4ed8"/>
<text class="legend" x="46" y="98" font-size="14" fill="#151a21">Обязательные шаги</text>
<rect class="swatch opt" x="236" y="86" width="14" height="14" fill="#b45309"/>
<text class="legend" x="258" y="98" font-size="14" fill="#151a21">Дополнительно (не нужны для первой заявки)</text>
<g class="bar" data-stage="s1">
<text class="label" x="344" y="139" text-anchor="end" font-size="15" fill="#151a21">Этап 1. Старт: приложение и чат мастера</text>
<rect class="seg req" data-stage="s1" data-steps="7" x="360" y="124" width="140" height="20" fill="#1d4ed8"/>
<text class="count" x="508" y="139" font-size="15" font-weight="700" fill="#151a21">7</text>
</g>
<g class="bar" data-stage="s2">
<text class="label" x="344" y="173" text-anchor="end" font-size="15" fill="#151a21">Этап 2. Снаряжение</text>
<rect class="seg req" data-stage="s2" data-steps="13" x="360" y="158" width="260" height="20" fill="#1d4ed8"/>
<rect class="seg opt" data-stage="s2" data-steps="7" x="620" y="158" width="140" height="20" fill="#b45309"/>
<text class="count" x="768" y="173" font-size="15" font-weight="700" fill="#151a21">20 (7 доп.)</text>
</g>
<g class="bar" data-stage="s3">
<text class="label" x="344" y="207" text-anchor="end" font-size="15" fill="#151a21">Этап 3. Софт на SSD</text>
<rect class="seg req" data-stage="s3" data-steps="5" x="360" y="192" width="100" height="20" fill="#1d4ed8"/>
<text class="count" x="468" y="207" font-size="15" font-weight="700" fill="#151a21">5</text>
</g>
<g class="bar" data-stage="s4">
<text class="label" x="344" y="241" text-anchor="end" font-size="15" fill="#151a21">Этап 4. Смена и первая заявка</text>
<rect class="seg req" data-stage="s4" data-steps="16" x="360" y="226" width="320" height="20" fill="#1d4ed8"/>
<text class="count" x="688" y="241" font-size="15" font-weight="700" fill="#151a21">16</text>
</g>
<g class="bar" data-stage="s4b">
<text class="label" x="344" y="275" text-anchor="end" font-size="15" fill="#151a21">Этап 4а. Документы: БСО и «Мод»</text>
<rect class="seg req" data-stage="s4b" data-steps="8" x="360" y="260" width="160" height="20" fill="#1d4ed8"/>
<text class="count" x="528" y="275" font-size="15" font-weight="700" fill="#151a21">8</text>
</g>
<g class="bar" data-stage="s5">
<text class="label" x="344" y="309" text-anchor="end" font-size="15" fill="#151a21">Этап 5. Если заявка не состоялась</text>
<rect class="seg req" data-stage="s5" data-steps="7" x="360" y="294" width="140" height="20" fill="#1d4ed8"/>
<text class="count" x="508" y="309" font-size="15" font-weight="700" fill="#151a21">7</text>
</g>
<g class="bar" data-stage="s6">
<text class="label" x="344" y="343" text-anchor="end" font-size="15" fill="#151a21">Этап 6. Приложение для клиентов</text>
<rect class="seg req" data-stage="s6" data-steps="3" x="360" y="328" width="60" height="20" fill="#1d4ed8"/>
<text class="count" x="428" y="343" font-size="15" font-weight="700" fill="#151a21">3</text>
</g>
<g class="bar" data-stage="s7">
<text class="label" x="344" y="377" text-anchor="end" font-size="15" fill="#151a21">Этап 7. Типовые заявки: с чего начать</text>
<rect class="seg req" data-stage="s7" data-steps="9" x="360" y="362" width="180" height="20" fill="#1d4ed8"/>
<text class="count" x="548" y="377" font-size="15" font-weight="700" fill="#151a21">9</text>
</g>
<g class="bar" data-stage="s8">
<text class="label" x="344" y="411" text-anchor="end" font-size="15" fill="#151a21">Этап 8. Как говорить с разными клиентами</text>
<rect class="seg req" data-stage="s8" data-steps="9" x="360" y="396" width="180" height="20" fill="#1d4ed8"/>
<text class="count" x="548" y="411" font-size="15" font-weight="700" fill="#151a21">9</text>
</g>
</svg>

name: Ошибка
description: Что-то работает не так, как описано, или ломается
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что пишете. Опишите ошибку так, чтобы её можно было повторить.

        **Не прикладывайте данные компании и клиентов:** названия приложений, ники, имена, ссылки, цены, номера заявок, телефоны и снимки экрана с ними. Если ошибка видна только на настоящем гайде, повторите её на демо (`python guide/build.py`) или перепишите пример на нейтральных данных.

        Об уязвимости пишите не здесь, а по правилам из [SECURITY.md](https://github.com/Alpha-Oi/field-tech-guide/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Где проявляется
      options:
        - Страница-гайд (этапы, шаги, отметки)
        - Памятка на заявку и отчёты
        - Прайс и акт
        - Сборка (guide/build.py)
        - Проверка утечек (tools/check_public.py)
        - Тексты гайда
        - Документация
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги, чтобы повторить
      description: По пунктам, с нуля. Для сборки — команда целиком.
      placeholder: |
        1. Откройте страницу
        2. Нажмите ...
        3. Увидите ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло на самом деле. Текст сообщения об ошибке или описание; снимок экрана — только если на нём нет данных компании и клиентов.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Версия из CHANGELOG.md или короткий хеш коммита (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Браузер
      description: Название и версия, если известна. Для сборки и проверок напишите версию Python.
      placeholder: Например, Chrome или Safari
  - type: input
    id: device
    attributes:
      label: Устройство и система
      placeholder: Например, телефон на Android или ноутбук с Windows
  - type: checkboxes
    id: no-private-data
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В описании и во вложениях нет данных компании и клиентов
          required: true
